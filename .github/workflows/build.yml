name: Build Droidspaces Kernel - hanoip

on:
  workflow_dispatch:
    inputs:
      KERNEL_BRANCH:
        description: 'Branch do kernel (veja a branch padrão do repo)'
        required: true
        default: 'android-13.0'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git bc bison flex libssl-dev libelf-dev \
            python3 make zip unzip ccache \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            clang-14 lld-14 llvm-14
          sudo ln -sf /usr/bin/clang-14       /usr/local/bin/clang
          sudo ln -sf /usr/bin/ld.lld-14      /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-14     /usr/local/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-14     /usr/local/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-strip-14  /usr/local/bin/llvm-strip
          sudo ln -sf /usr/bin/llvm-objcopy-14 /usr/local/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-14 /usr/local/bin/llvm-objdump

      - name: Configurar ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 2G
          key: hanoip-${{ github.run_id }}
          restore-keys: hanoip-

      - name: Clonar kernel
        run: |
          git clone --depth=1 -b "${{ github.event.inputs.KERNEL_BRANCH }}" https://github.com/RickzinGG/android_kernel_motorola_sm6150 "${{ github.workspace }}/kernel"

      - name: Clonar AnyKernel3
        run: |
          git clone --depth=1 -b hanoip https://github.com/RickzinGG/AnyKernel3 "${{ github.workspace }}/AnyKernel3"

      - name: Compilar kernel
        run: |
          cd ${{ github.workspace }}/kernel

          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export STRIP=llvm-strip
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH="/usr/lib/ccache:$PATH"

          make O=out ARCH=arm64 clean mrproper
          make O=out ARCH=arm64 vendor/hanoip_defconfig

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            STRIP=llvm-strip OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            2>&1 | tee ${{ github.workspace }}/build.log

          if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "BUILD_SUCCESS=true" >> $GITHUB_ENV
            echo "✅ Kernel compilado!"
          else
            echo "❌ Falha! Últimas 50 linhas do log:"
            tail -50 ${{ github.workspace }}/build.log
            exit 1
          fi

      - name: Empacotar com AnyKernel3
        if: env.BUILD_SUCCESS == 'true'
        run: |
          BOOT=${{ github.workspace }}/kernel/out/arch/arm64/boot
          AK3=${{ github.workspace }}/AnyKernel3
          cp $BOOT/Image.gz $AK3/
          [ -f $BOOT/dtbo.img ] && cp $BOOT/dtbo.img $AK3/
          [ -f $BOOT/dtb ]      && cp $BOOT/dtb $AK3/
          DATE=$(date +"%Y%m%d-%H%M")
          ZIP="Droidspaces-hanoip-A13-${DATE}.zip"
          cd $AK3
          zip -r9 ${{ github.workspace }}/$ZIP . -x ".git/*"
          echo "ZIP_NAME=$ZIP" >> $GITHUB_ENV

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        if: env.BUILD_SUCCESS == 'true'
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ github.workspace }}/${{ env.ZIP_NAME }}
          retention-days: 7

      - name: Upload log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: ${{ github.workspace }}/build.log
          retention-days: 3

      - name: Criar Release
        uses: softprops/action-gh-release@v1
        if: env.BUILD_SUCCESS == 'true'
        with:
          tag_name: droidspaces-${{ github.run_number }}
          name: "Droidspaces Kernel - hanoip - Build #${{ github.run_number }}"
          body: |
            Dispositivo: Moto G60 (hanoip)
            Chipset: Snapdragon 732G (SM7150)
            Kernel: 4.14 CAF
            ROM: PixelExperience Plus Android 13
            Toolchain: Clang 14 + LLD
          files: ${{ github.workspace }}/${{ env.ZIP_NAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          
